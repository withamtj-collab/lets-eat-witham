[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The Supabase URL and publishable key are public by design: they ship to the
  # browser in index.html and data is protected by row-level security.
  # GCAL_ICS_URL is a real secret and remains covered by secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY"
